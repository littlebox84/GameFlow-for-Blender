name: Build GameFlow Test ZIP

on:
  push:
    branches:
      - 'v0.5-step*'
    paths:
      - 'gameflow_blender/**'
      - '.github/workflows/test-build.yml'
  workflow_dispatch:

jobs:
  build-test-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile gameflow_blender/*.py

      - name: Build Blender install ZIP
        shell: bash
        run: |
          mkdir -p dist
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
          ZIP_NAME="GameFlow-${SAFE_BRANCH}-Test.zip"
          zip -r "dist/${ZIP_NAME}" gameflow_blender
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GameFlow-${{ github.ref_name }}-Test
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 7
