name: Build GameFlow Test Release

on:
  push:
    branches:
      - 'v0.5-step*'
    paths:
      - 'gameflow_blender/**'
      - '.github/workflows/test-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile gameflow_blender/*.py

      - name: Build Blender install ZIP
        shell: bash
        run: |
          mkdir -p dist
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
          ZIP_NAME="GameFlow-${SAFE_BRANCH}-Test.zip"
          TAG_NAME="${SAFE_BRANCH}-test-${GITHUB_RUN_NUMBER}"
          zip -r "dist/${ZIP_NAME}" gameflow_blender
          sha256sum "dist/${ZIP_NAME}" > "dist/${ZIP_NAME}.sha256"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"

      - name: Publish test prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: GameFlow ${{ github.ref_name }} Test Build
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Test build from `${{ github.ref_name }}`.

            Install the ZIP directly in Blender using Edit → Preferences → Add-ons → Install from Disk.

            This is a prerelease test build, not the stable release.
          files: |
            dist/${{ env.ZIP_NAME }}
            dist/${{ env.ZIP_NAME }}.sha256
