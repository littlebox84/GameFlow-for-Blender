name: Build GameFlow Test ZIP

on:
  push:
    branches:
      - v0.5-step3-build-assist
    paths:
      - 'gameflow_blender/**'
      - '.github/workflows/test-build.yml'
  workflow_dispatch:

jobs:
  build-test-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile gameflow_blender/*.py

      - name: Build Blender install ZIP
        run: |
          mkdir -p dist
          zip -r dist/GameFlow-Step3-Build-Assist-Test.zip gameflow_blender

      - name: Upload test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GameFlow-Step3-Build-Assist-Test
          path: dist/GameFlow-Step3-Build-Assist-Test.zip
          if-no-files-found: error
          retention-days: 7
