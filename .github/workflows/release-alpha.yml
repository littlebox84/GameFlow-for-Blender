name: Build GameFlow Alpha Release

on:
  push:
    branches: [ main ]
    paths:
      - 'gameflow_blender/**'
      - '.github/workflows/release-alpha.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python -m py_compile gameflow_blender/*.py

      - name: Build Blender install ZIP
        run: |
          mkdir -p dist
          find gameflow_blender -type d -name '__pycache__' -prune -exec rm -rf {} +
          zip -r dist/GameFlow-for-Blender-v0.6.1-alpha.zip gameflow_blender -x '*/__pycache__/*' '*.pyc'
          sha256sum dist/GameFlow-for-Blender-v0.6.1-alpha.zip > dist/GameFlow-for-Blender-v0.6.1-alpha.sha256

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.1-alpha
          name: GameFlow for Blender v0.6.1-alpha
          prerelease: true
          generate_release_notes: true
          body: |
            # GameFlow for Blender v0.6.1-alpha

            **From player to creator.**

            This release focuses GameFlow on a cleaner beginner workflow with game-style navigation, a simplified creator UI, and the first Quick Rig system.

            Highlights:
            - Beginner-focused sidebar with Explore and Build modes
            - Lower-center contextual viewport helper instead of a corner HUD
            - Quick Rig snap-guide workflow for humanoid characters
            - Create body guides, position joints, build a humanoid armature, and bind with automatic weights
            - Build tools for adding, moving, duplicating, rotating, snapping, and dropping objects to the floor
            - GameFlow navigation preserved: WASD move, Q/E vertical movement, RMB look, Shift sprint, mouse-wheel zoom
            - Paint mode and Paint Studio removed from this release
            - Safe Mode, repair tools, control backup/restore, and file-load recovery retained

            Install by downloading `GameFlow-for-Blender-v0.6.1-alpha.zip`, then in Blender use **Edit → Preferences → Add-ons → Install from Disk**. Do not extract the ZIP first.
          files: |
            dist/GameFlow-for-Blender-v0.6.1-alpha.zip
            dist/GameFlow-for-Blender-v0.6.1-alpha.sha256
