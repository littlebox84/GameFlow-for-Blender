name: Build GameFlow Alpha Release

on:
  push:
    branches: [ main ]
    paths:
      - 'gameflow_blender/**'
      - '.github/workflows/release-alpha.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python -m py_compile gameflow_blender/*.py

      - name: Build Blender install ZIP
        run: |
          mkdir -p dist
          zip -r dist/GameFlow-for-Blender-v0.4.1-alpha.zip gameflow_blender
          sha256sum dist/GameFlow-for-Blender-v0.4.1-alpha.zip > dist/GameFlow-for-Blender-v0.4.1-alpha.sha256

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.1-alpha
          name: GameFlow for Blender v0.4.1-alpha
          prerelease: true
          generate_release_notes: true
          body: |
            # GameFlow for Blender v0.4.1-alpha

            **From player to creator.**

            GameFlow 0.4.1 adds a dark in-viewport HUD and clearer control-preset guidance while keeping the Creator Update intact.

            Highlights:
            - New dark viewport HUD with Full, Minimal, and Off modes
            - HUD shows Creator Mode, READY/PAUSED status, selected object, and contextual information
            - Build HUD shows grid step, rotation step, and snap state
            - Explore HUD shows movement and look tuning
            - Clear in-app guide explaining GameFlow, Roblox, Minecraft, First-Person, Steam Controller, Accessibility, and Custom presets
            - Explicit clarification: Steam Input maps the physical controller; the Steam Controller preset only changes GameFlow tuning
            - Explore, Build, Paint, WASD navigation, creator tools, keymap safety, repair tools, and project-load recovery remain intact

            Install by downloading `GameFlow-for-Blender-v0.4.1-alpha.zip`, then in Blender use **Edit → Preferences → Add-ons → Install from Disk**. Do not extract the ZIP first.
          files: |
            dist/GameFlow-for-Blender-v0.4.1-alpha.zip
            dist/GameFlow-for-Blender-v0.4.1-alpha.sha256
