name: Build GameFlow Alpha Release

on:
  push:
    branches: [ main ]
    paths:
      - 'gameflow_blender/**'
      - '.github/workflows/release-alpha.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python -m py_compile gameflow_blender/*.py

      - name: Build Blender install ZIP
        run: |
          mkdir -p dist
          zip -r dist/GameFlow-for-Blender-v0.3.0-alpha.zip gameflow_blender
          sha256sum dist/GameFlow-for-Blender-v0.3.0-alpha.zip > dist/GameFlow-for-Blender-v0.3.0-alpha.sha256

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-alpha
          name: GameFlow for Blender v0.3.0-alpha
          prerelease: true
          generate_release_notes: true
          body: |
            # GameFlow for Blender v0.3.0-alpha

            **From player to creator.**

            This public alpha adds the redesigned beginner-first UI and core reliability improvements from GameFlow 0.3.0.

            Highlights:
            - Cleaner READY / PAUSED status and Quick Feel controls
            - Collapsible Controls, Controller, Advanced, and Support sections
            - One-click Repair GameFlow recovery
            - Modifier-safe input so Blender shortcuts such as Ctrl+S and Ctrl+Z pass through normally
            - Focus-loss protection to prevent stuck movement after Alt-Tab
            - Unlimited RMB mouse-look with cursor recentering and optional cursor return
            - Persistent project-load recovery, keymap backup/restore, presets, diagnostics, and Steam Input guidance

            Install by downloading `GameFlow-for-Blender-v0.3.0-alpha.zip` below, then in Blender use **Edit → Preferences → Add-ons → Install from Disk**. Do not extract the ZIP first.
          files: |
            dist/GameFlow-for-Blender-v0.3.0-alpha.zip
            dist/GameFlow-for-Blender-v0.3.0-alpha.sha256
