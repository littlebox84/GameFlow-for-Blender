name: Build GameFlow Alpha Release

on:
  push:
    branches: [ main ]
    paths:
      - 'gameflow_blender/**'
      - '.github/workflows/release-alpha.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python -m py_compile gameflow_blender/*.py

      - name: Build Blender install ZIP
        run: |
          mkdir -p dist
          zip -r dist/GameFlow-for-Blender-v0.5.0-alpha.zip gameflow_blender
          sha256sum dist/GameFlow-for-Blender-v0.5.0-alpha.zip > dist/GameFlow-for-Blender-v0.5.0-alpha.sha256

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0-alpha
          name: GameFlow for Blender v0.5.0-alpha
          prerelease: true
          generate_release_notes: true
          body: |
            # GameFlow for Blender v0.5.0-alpha

            **From player to creator.**

            GameFlow 0.5 is the Placement & Stability update.

            Highlights:
            - Ghost-preview object placement for Cube, Cylinder, Sphere, Plane, and Cone
            - Scene surface targeting with world-floor fallback
            - Placement Grid Snap using the GameFlow Build Step
            - Continuous Placement mode
            - R-to-rotate preview using the configured Rotation Step
            - New GameFlow Health Check
            - New Safe Mode that restores normal Blender controls while keeping Creator tools available
            - Dark HUD now shows SAFE status and placement settings
            - Existing Explore, Build, Paint, navigation safety, keymap backup/restore, Repair GameFlow, presets, and Steam Input guidance remain intact

            This is still a public alpha. Syntax is automatically validated here, but the new placement workflow needs real Blender testing across supported versions and different scenes.

            Install by downloading `GameFlow-for-Blender-v0.5.0-alpha.zip`, then in Blender use **Edit → Preferences → Add-ons → Install from Disk**. Do not extract the ZIP first.
          files: |
            dist/GameFlow-for-Blender-v0.5.0-alpha.zip
            dist/GameFlow-for-Blender-v0.5.0-alpha.sha256
