name: Build GameFlow Alpha Release

on:
  push:
    branches: [ main ]
    paths:
      - 'gameflow_blender/**'
      - '.github/workflows/release-alpha.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python -m py_compile gameflow_blender/*.py

      - name: Build Blender install ZIP
        run: |
          mkdir -p dist
          zip -r dist/GameFlow-for-Blender-v0.4.0-alpha.zip gameflow_blender
          sha256sum dist/GameFlow-for-Blender-v0.4.0-alpha.zip > dist/GameFlow-for-Blender-v0.4.0-alpha.sha256

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0-alpha
          name: GameFlow for Blender v0.4.0-alpha
          prerelease: true
          generate_release_notes: true
          body: |
            # GameFlow for Blender v0.4.0-alpha

            **From player to creator.**

            GameFlow 0.4 is the Creator Update: familiar navigation now grows into an approachable creation workflow.

            Highlights:
            - New Creator Modes: Explore, Build, and Paint
            - Game-style primitive creation and transform-tool switching
            - Configurable build and rotation steps
            - X/Y/Z nudge controls
            - X/Y/Z stepped rotation
            - Duplicate + Offset construction tools
            - Drop to Floor and Focus Selected
            - Increment snapping toggle
            - Quick Plastic, Metal, Matte, Glass, and Glow materials
            - Existing WASD navigation, unlimited RMB look, keymap safety, repair tools, diagnostics, project-load recovery, and Steam Input support remain intact

            Install by downloading `GameFlow-for-Blender-v0.4.0-alpha.zip`, then in Blender use **Edit → Preferences → Add-ons → Install from Disk**. Do not extract the ZIP first.
          files: |
            dist/GameFlow-for-Blender-v0.4.0-alpha.zip
            dist/GameFlow-for-Blender-v0.4.0-alpha.sha256
