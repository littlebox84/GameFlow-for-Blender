name: Build GameFlow Alpha Release

on:
  push:
    branches: [ main ]
    paths:
      - 'gameflow_blender/**'
      - '.github/workflows/release-alpha.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python -m py_compile gameflow_blender/*.py

      - name: Build Blender install ZIP
        run: |
          mkdir -p dist
          zip -r dist/GameFlow-for-Blender-v0.5.5-alpha.zip gameflow_blender
          sha256sum dist/GameFlow-for-Blender-v0.5.5-alpha.zip > dist/GameFlow-for-Blender-v0.5.5-alpha.sha256

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.5-alpha
          name: GameFlow for Blender v0.5.5-alpha
          prerelease: true
          generate_release_notes: true
          body: |
            # GameFlow for Blender v0.5.5-alpha

            **From player to creator.**

            Blender 5.0.x compatibility hotfix #5.

            Fixes:
            - Fixes the GameFlow sidebar showing `GameFlow preferences unavailable` after successful add-on registration
            - Makes preference lookup robust to Blender 5.x legacy/extension module namespaces
            - Resolves exact package IDs, leaf IDs, namespaced IDs, module suffix matches, and the actual GameFlow preferences RNA type
            - Keeps the Blender 5 restricted-data startup guard from v0.5.4
            - Keeps the idempotent AddonPreferences registration fixes from v0.5.3
            - Retains all v0.5 Placement & Stability features

            Install `GameFlow-for-Blender-v0.5.5-alpha.zip` directly with **Edit → Preferences → Add-ons → Install from Disk**. Do not extract the ZIP first.
          files: |
            dist/GameFlow-for-Blender-v0.5.5-alpha.zip
            dist/GameFlow-for-Blender-v0.5.5-alpha.sha256
