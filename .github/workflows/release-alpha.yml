name: Build GameFlow Alpha Release

on:
  push:
    branches: [ main ]
    paths:
      - 'gameflow_blender/**'
      - '.github/workflows/release-alpha.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python -m py_compile gameflow_blender/*.py

      - name: Build Blender install ZIP
        run: |
          mkdir -p dist
          zip -r dist/GameFlow-for-Blender-v0.5.1-alpha.zip gameflow_blender
          sha256sum dist/GameFlow-for-Blender-v0.5.1-alpha.zip > dist/GameFlow-for-Blender-v0.5.1-alpha.sha256

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.1-alpha
          name: GameFlow for Blender v0.5.1-alpha
          prerelease: true
          generate_release_notes: true
          body: |
            # GameFlow for Blender v0.5.1-alpha

            **From player to creator.**

            GameFlow 0.5.1 is a Blender 5.x registration/reload hotfix on top of the Placement & Stability update.

            Fixes:
            - Fixes `already registered as a subclass 'GAMEFLOW_Preferences'` when Blender retains stale GameFlow RNA classes during add-on reinstall/update/reload
            - Adds package-level stale-class cleanup before registration
            - Cleanup covers GameFlow Preferences, navigation, Build tools, placement, health, and UI classes rather than only the first failing class
            - Keeps the v0.5 ghost placement, surface placement, Safe Mode, Health Check, dark HUD, Creator Modes, keymap safety, and controller guidance intact

            This is still a public alpha. Python syntax is automatically validated before packaging. Blender 5.x install/update/reload behavior should still be tested on real installations.

            Install by downloading `GameFlow-for-Blender-v0.5.1-alpha.zip`, then in Blender use **Edit → Preferences → Add-ons → Install from Disk**. Do not extract the ZIP first.
          files: |
            dist/GameFlow-for-Blender-v0.5.1-alpha.zip
            dist/GameFlow-for-Blender-v0.5.1-alpha.sha256
