name: Build GameFlow Alpha Release

on:
  push:
    branches: [ main ]
    paths:
      - 'gameflow_blender/**'
      - '.github/workflows/release-alpha.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python -m py_compile gameflow_blender/*.py

      - name: Build Blender install ZIP
        run: |
          mkdir -p dist
          zip -r dist/GameFlow-for-Blender-v0.5.6-alpha.zip gameflow_blender
          sha256sum dist/GameFlow-for-Blender-v0.5.6-alpha.zip > dist/GameFlow-for-Blender-v0.5.6-alpha.sha256

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.6-alpha
          name: GameFlow for Blender v0.5.6-alpha
          prerelease: true
          generate_release_notes: true
          body: |
            # GameFlow for Blender v0.5.6-alpha

            **From player to creator.**

            Blender 5.0.x preference registration hotfix.

            Fixes:
            - Fixes GameFlow Preferences being skipped because `bl_rna` was inherited from Blender's `AddonPreferences` base class
            - Detects registration only when RNA metadata belongs directly to the GameFlow subclass or Blender exposes that exact class object
            - Ensures `GAMEFLOW_Preferences` is actually registered and attached to the enabled GameFlow add-on entry
            - Keeps robust namespaced preference lookup from v0.5.5
            - Keeps the Blender 5 restricted-data startup guard and idempotent stale-class cleanup
            - Retains the full v0.5 Placement & Stability feature set

            Install `GameFlow-for-Blender-v0.5.6-alpha.zip` with **Edit → Preferences → Add-ons → Install from Disk**. Fully close Blender before replacing an older GameFlow build. Do not extract the ZIP first.
          files: |
            dist/GameFlow-for-Blender-v0.5.6-alpha.zip
            dist/GameFlow-for-Blender-v0.5.6-alpha.sha256
