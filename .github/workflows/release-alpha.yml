name: Build GameFlow Alpha Release

on:
  push:
    branches: [ main ]
    paths:
      - 'gameflow_blender/**'
      - '.github/workflows/release-alpha.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python -m py_compile gameflow_blender/*.py

      - name: Build Blender install ZIP
        run: |
          mkdir -p dist
          zip -r dist/GameFlow-for-Blender-v0.5.4-alpha.zip gameflow_blender
          sha256sum dist/GameFlow-for-Blender-v0.5.4-alpha.zip > dist/GameFlow-for-Blender-v0.5.4-alpha.sha256

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.4-alpha
          name: GameFlow for Blender v0.5.4-alpha
          prerelease: true
          generate_release_notes: true
          body: |
            # GameFlow for Blender v0.5.4-alpha

            **From player to creator.**

            Blender 5.0.5 registration hotfix #4.

            Fixes:
            - Fixes `'_RestrictData' object has no attribute 'objects'` during add-on enable
            - Prevents GameFlow placement preview cleanup from touching `bpy.data.objects` while Blender is in restricted registration state
            - Routes both placement and lifecycle cleanup through a Blender-5-safe guard before registration
            - Keeps the v0.5.3 idempotent AddonPreferences registration fixes
            - Retains all Placement & Stability features

            Install `GameFlow-for-Blender-v0.5.4-alpha.zip` directly with **Edit → Preferences → Add-ons → Install from Disk**. Do not extract the ZIP first.
          files: |
            dist/GameFlow-for-Blender-v0.5.4-alpha.zip
            dist/GameFlow-for-Blender-v0.5.4-alpha.sha256
