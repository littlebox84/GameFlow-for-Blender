name: Build GameFlow Alpha Release

on:
  push:
    branches: [ main ]
    paths:
      - 'gameflow_blender/**'
      - '.github/workflows/release-alpha.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python -m py_compile gameflow_blender/*.py

      - name: Build Blender install ZIP
        run: |
          mkdir -p dist
          zip -r dist/GameFlow-for-Blender-v0.5.0-alpha2.zip gameflow_blender
          sha256sum dist/GameFlow-for-Blender-v0.5.0-alpha2.zip > dist/GameFlow-for-Blender-v0.5.0-alpha2.sha256

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0-alpha2
          name: GameFlow for Blender v0.5.0-alpha2
          prerelease: true
          generate_release_notes: true
          body: |
            # GameFlow for Blender v0.5.0-alpha2

            **From player to creator.**

            GameFlow 0.5 alpha2 is the hardened Placement & Stability build.

            Highlights:
            - Ghost-preview placement for Cube, Cylinder, Sphere, Plane, and Cone
            - Surface-aware placement that rests objects against hit geometry instead of embedding their centers
            - World-floor fallback when no scene surface is hit
            - Placement Grid Snap using the GameFlow Build Step
            - Continuous Placement mode
            - R-to-rotate preview using the configured Rotation Step
            - Orphan preview cleanup across register/unregister and file-load transitions
            - Placement limited to Object Mode for predictable behavior
            - GameFlow Health Check
            - Safe Mode that restores normal Blender controls while keeping Creator tools available
            - Safe Mode persists correctly across project loads
            - Dark HUD SAFE state and placement information
            - Expanded placement/stability test matrix
            - Existing Explore, Build, Paint, navigation safety, keymap backup/restore, Repair GameFlow, presets, and Steam Input guidance remain intact

            This is still a public alpha. Python syntax is automatically validated before packaging, but the placement workflow still needs real Blender testing across supported versions and different scenes.

            Install by downloading `GameFlow-for-Blender-v0.5.0-alpha2.zip`, then in Blender use **Edit → Preferences → Add-ons → Install from Disk**. Do not extract the ZIP first.
          files: |
            dist/GameFlow-for-Blender-v0.5.0-alpha2.zip
            dist/GameFlow-for-Blender-v0.5.0-alpha2.sha256
