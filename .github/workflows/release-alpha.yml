name: Build GameFlow Alpha Release

on:
  push:
    branches: [ main ]
    paths:
      - 'gameflow_blender/**'
      - '.github/workflows/release-alpha.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python -m py_compile gameflow_blender/*.py

      - name: Build Blender install ZIP
        run: |
          mkdir -p dist
          zip -r dist/GameFlow-for-Blender-v0.5.2-alpha.zip gameflow_blender
          sha256sum dist/GameFlow-for-Blender-v0.5.2-alpha.zip > dist/GameFlow-for-Blender-v0.5.2-alpha.sha256

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.2-alpha
          name: GameFlow for Blender v0.5.2-alpha
          prerelease: true
          generate_release_notes: true
          body: |
            # GameFlow for Blender v0.5.2-alpha

            **From player to creator.**

            Blender 5.0.5 registration hotfix #2.

            Fixes:
            - Adds direct scanning of `AddonPreferences.__subclasses__()` for stale GameFlow preference classes
            - Removes old GameFlow AddonPreferences even when Blender does not expose them through `bpy.types`
            - Retries preferences registration once after stale-class cleanup when Blender reports `already registered as a subclass`
            - Keeps the package-level cleanup for all other GameFlow RNA classes
            - Retains all v0.5 Placement & Stability features

            This build specifically targets the repeated `GAMEFLOW_Preferences` registration failure observed on Blender 5.0.5 during legacy add-on reinstall/update cycles.

            Install by downloading `GameFlow-for-Blender-v0.5.2-alpha.zip`, fully closing Blender, reopening it, then using **Edit → Preferences → Add-ons → Install from Disk**. Do not extract the ZIP.
          files: |
            dist/GameFlow-for-Blender-v0.5.2-alpha.zip
            dist/GameFlow-for-Blender-v0.5.2-alpha.sha256
