name: Python syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile GameFlow modules
        run: python -m compileall -q gameflow_blender

      - name: Compile standalone keymap
        run: python -m py_compile GameFlow_Minimal_Keymap.py
